name: Build plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build with Maven
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: CCTVMode-jar
          path: target/CCTVMode-1.0.0.jar
